<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Sogon Juara</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: linear-gradient(rgba(16,26,18,0.30), rgba(16,26,18,0.50)), url("images/sogon-bg.jpg") center / cover no-repeat fixed, #101a12; color: #eef5ee; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 24px; margin: 8px 0 4px; text-align: center; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
  .sub { text-align: center; color: #d6e8d6; font-size: 14px; margin: 0 0 20px; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
  .controls { display: flex; gap: 10px; align-items: center; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }
  .controls label { font-size: 14px; color: #cfe0cf; display: flex; gap: 6px; align-items: center; }
  .stop { background: #b23b3b; color: #fff; border: none; border-radius: 999px; padding: 10px 22px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .track { display: flex; align-items: center; gap: 12px; background: #1c2b1f; border: 1px solid #2c422f; border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .track.playing { border-color: #7bc47f; background: #223626; }
  .play { flex: none; width: 52px; height: 52px; border-radius: 50%; border: none; background: #4caf50; color: #fff; font-size: 22px; cursor: pointer; }
  .sec-sogon .play { background: #d32f2f; }
  .sec-alam .play { background: #f9a825; color: #222; }
  .sec-isian .play { background: #43a047; }
  .name { flex: 1; font-size: 16px; font-weight: 600; line-height: 1.3; }
  .name small { display: block; font-weight: 400; font-size: 13px; color: #9db89d; }
  .loop { flex: none; font-size: 13px; color: #cfe0cf; display: flex; gap: 5px; align-items: center; cursor: pointer; }
  .now { text-align: center; color: #7bc47f; font-size: 14px; min-height: 20px; margin: 4px 0 14px; }
  .tabs { display: flex; gap: 8px; margin: 0 0 16px; }
  .tab { flex: 1; background: #1c2b1f; color: #cfe0cf; border: 1px solid #2c422f; border-radius: 12px; padding: 11px 6px; font-size: 14px; font-weight: 600; cursor: pointer; opacity: 0.55; }
  .tab.active { opacity: 1; border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,0.35); }
  .tab-sogon { background: #d32f2f; color: #fff; }
  .tab-alam { background: #f9a825; color: #222; }
  .tab-isian { background: #43a047; color: #fff; }
  .credit { text-align: center; color: #7d927d; font-size: 12px; margin-top: 24px; line-height: 1.6; }
  .credit a { color: #9db89d; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Project Sogon Juara</h1>
  <p class="sub">Pancingan &amp; pikat burung sogok ontong, masteran, dan terapi alam — ketuk ▶ untuk memutar</p>

  <div class="controls">
    <button class="stop" id="stopAll">■ Berhenti Semua</button>
    <label><input type="checkbox" id="loopAll"> Ulangi terus</label>
    <label>Volume <input type="range" id="vol" min="0" max="100" value="100"></label>
  </div>
  <div class="now" id="nowPlaying"></div>

  <div class="tabs">
    <button class="tab tab-sogon active" data-sec="Suara Sogon">Suara Sogon</button>
    <button class="tab tab-alam" data-sec="Terapi Alam">Suara Alam</button>
    <button class="tab tab-isian" data-sec="Masteran Burung">Isian / Masteran</button>
  </div>

  <div id="list"></div>

  <p class="credit">Website ini dibuat oleh Bambang Herwanto</p>
</div>

<audio id="player" preload="none"></audio>

<script>
var tracks = [
  { sec: "Suara Sogon", file: "audio/sogon-pikat.mp3", name: "Pikat", desc: "Suara sogok ontong untuk pikat" },
  { sec: "Suara Sogon", file: "audio/sogon-pancingan.mp3", name: "Pancingan Bunyi", desc: "Gacor pancingan bunyi" },
  { sec: "Suara Sogon", file: "audio/sogon-memanggil-lawan.mp3", name: "Memanggil Lawan", desc: "Gacor memanggil lawan" },
  { sec: "Suara Sogon", file: "audio/sogon-masteran.mp3", name: "Tembakan Masteran", desc: "Tembakan sogok ontong gacor masteran" },
  { sec: "Suara Sogon", file: "audio/sogon-speed-rapat.mp3", name: "Speed Rapat Nembak Panjang", desc: "Gacor speed rapat nembak panjang" },
  { sec: "Suara Sogon", file: "audio/sogon-nyecret.mp3", name: "Tembakan Nyecret Panjang", desc: "Tembakan nyecret panjang" },
  { sec: "Suara Sogon", file: "audio/sogon-isian-kenari.mp3", name: "Isian Kenari", desc: "Gacor isian kenari" },
  { sec: "Suara Sogon", file: "audio/sogon-tembakan-pedas.mp3", name: "Tembakan Pedas", desc: "Tembakan pedas" },
  { sec: "Suara Sogon", file: "audio/sogon-nembak-panjang.mp3", name: "Nembak Panjang", desc: "Nembak panjang" },
  { sec: "Suara Sogon", file: "audio/sogon-alam-liar.mp3", name: "Di Alam Liar", desc: "Suara sogok ontong di alam liar" },
  { sec: "Suara Sogon", file: "audio/sogon-betina.mp3", name: "Sogon Betina", desc: "Pancingan sogon betina memanggil jantan" },
  { sec: "Terapi Alam", file: "audio/terapi-air-mengalir.mp3", name: "Air Mengalir", desc: "Suara air mengalir, terapi menenangkan" },
  { sec: "Terapi Alam", file: "audio/terapi-air-terjun.mp3", name: "Air Terjun", desc: "Suara air terjun, terapi menenangkan" },
  { sec: "Terapi Alam", file: "audio/terapi-hujan.mp3", name: "Hujan", desc: "Suara hujan, terapi menenangkan" },
  { sec: "Terapi Alam", file: "audio/terapi-hujan-hutan.mp3", name: "Hujan di Hutan", desc: "Suara hujan di hutan, terapi menenangkan" },
  { sec: "Terapi Alam", file: "audio/terapi-alam-burung.mp3", name: "Alam & Burung", desc: "Suara air mengalir dan burung di alam" },
  { sec: "Terapi Alam", file: "audio/terapi-gemericik-air.mp3", name: "Gemericik Air", desc: "Suara gemericik air, terapi burung stres" },
  { sec: "Terapi Alam", file: "audio/terapi-ombak-laut.mp3", name: "Ombak Laut", desc: "Suara ombak laut, terapi menenangkan" },
  { sec: "Terapi Alam", file: "audio/terapi-desir-angin.mp3", name: "Desir Angin", desc: "Suara angin di pepohonan, terapi menenangkan" },
  { sec: "Terapi Alam", file: "audio/terapi-hutan-pagi.mp3", name: "Hutan Pagi", desc: "Kicau burung hutan pagi hari, terapi menenangkan" },
  { sec: "Masteran Burung", file: "audio/masteran-cililin.mp3", name: "Cililin", desc: "Masteran cililin" },
  { sec: "Masteran Burung", file: "audio/isian-kapas-tembak.mp3", name: "Kapas Tembak", desc: "Masteran kapas tembak" },
  { sec: "Masteran Burung", file: "audio/isian-cucak-jenggot.mp3", name: "Cucak Jenggot", desc: "Masteran cucak jenggot" },
  { sec: "Masteran Burung", file: "audio/isian-tengkek-buto.mp3", name: "Tengkek Buto", desc: "Masteran tengkek buto" },
  { sec: "Masteran Burung", file: "audio/isian-kenari.mp3", name: "Kenari", desc: "Masteran kenari" },
  { sec: "Masteran Burung", file: "audio/masteran-lovebird.mp3", name: "Lovebird Ngekek", desc: "Masteran lovebird ngekek panjang" },
  { sec: "Masteran Burung", file: "audio/isian-konin.mp3", name: "Konin", desc: "Masteran kolibri ninja (konin)" },
  { sec: "Masteran Burung", file: "audio/isian-pelatuk-beras.mp3", name: "Pelatuk Sampit / Beras", desc: "Masteran pelatuk beras" },
  { sec: "Masteran Burung", file: "audio/isian-gereja-tarung.mp3", name: "Gereja Tarung", desc: "Masteran gereja tarung" },
  { sec: "Masteran Burung", file: "audio/isian-srindit.mp3", name: "Srindit", desc: "Masteran srindit" },
  { sec: "Masteran Burung", file: "audio/isian-cucak-cungkok.mp3", name: "Cucak Cungkok", desc: "Masteran cucak cungkok" },
  { sec: "Masteran Burung", file: "audio/isian-rambatan-doraemon.mp3", name: "Rambatan Doraemon", desc: "Masteran rambatan doraemon" },
  { sec: "Masteran Burung", file: "audio/isian-siri-siri.mp3", name: "Siri Siri Kecil", desc: "Masteran siri siri kecil" },
  { sec: "Masteran Burung", file: "audio/isian-belalang-kecek.mp3", name: "Belalang Kecek", desc: "Masteran belalang kecek" },
  { sec: "Masteran Burung", file: "audio/isian-pelatuk-bawang.mp3", name: "Pelatuk Bawang", desc: "Masteran pelatuk bawang" },
  { sec: "Masteran Burung", file: "audio/isian-perenjak-lumut.mp3", name: "Perenjak Lumut", desc: "Masteran perenjak lumut" },
  { sec: "Masteran Burung", file: "audio/isian-ciblek-kristal.mp3", name: "Ciblek Kristal", desc: "Masteran ciblek kristal" },
  { sec: "Masteran Burung", file: "audio/masteran-ciblek-lovebird-kenari.mp3", name: "Ciblek, Lovebird & Kenari", desc: "Masteran ciblek, lovebird dan kenari" }
];
var player = document.getElementById("player");
var list = document.getElementById("list");
var nowEl = document.getElementById("nowPlaying");
var current = -1;
var activeSec = "Suara Sogon";

function render() {
  list.innerHTML = "";
  list.className = activeSec === "Suara Sogon" ? "sec-sogon" : activeSec === "Terapi Alam" ? "sec-alam" : "sec-isian";
  var n = 0;
  tracks.forEach(function (t, i) {
    if (t.sec !== activeSec) return;
    n++;
    var row = document.createElement("div");
    row.className = "track" + (i === current && !player.paused ? " playing" : "");
    var btn = document.createElement("button");
    btn.className = "play";
    btn.textContent = (i === current && !player.paused) ? "⏸" : "▶";
    btn.setAttribute("aria-label", "Putar " + t.name);
    btn.onclick = function () { toggle(i); };
    var nm = document.createElement("div");
    nm.className = "name";
    nm.innerHTML = "";
    var title = document.createElement("span");
    title.textContent = n + ". " + t.name;
    var small = document.createElement("small");
    small.textContent = t.desc;
    nm.appendChild(title);
    nm.appendChild(small);
    row.appendChild(btn);
    row.appendChild(nm);
    list.appendChild(row);
  });
}

function toggle(i) {
  if (current === i && !player.paused) {
    player.pause();
  } else {
    if (current !== i) {
      player.src = tracks[i].file;
      current = i;
    }
    player.play();
  }
  render();
}

player.addEventListener("play", function () {
  nowEl.textContent = current >= 0 ? "▶ Memutar: " + tracks[current].name : "";
  render();
});
player.addEventListener("pause", function () {
  nowEl.textContent = "";
  render();
});
player.addEventListener("ended", function () {
  nowEl.textContent = "";
  render();
});

document.getElementById("stopAll").onclick = function () {
  player.pause();
  player.currentTime = 0;
  current = -1;
  nowEl.textContent = "";
  render();
};
document.getElementById("loopAll").onchange = function (e) {
  player.loop = e.target.checked;
};
document.getElementById("vol").oninput = function (e) {
  player.volume = e.target.value / 100;
};

document.querySelectorAll(".tab").forEach(function (b) {
  b.onclick = function () {
    document.querySelectorAll(".tab").forEach(function (x) { x.classList.remove("active"); });
    b.classList.add("active");
    activeSec = b.getAttribute("data-sec");
    render();
  };
});

render();
</script>
</body>
</html>
